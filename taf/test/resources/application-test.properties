# API Test Automation Framework Configuration

# Environment Configuration
test.environment=local
test.base.url=http://localhost:8080

# API Endpoints
api.gateway.base.url=${test.base.url}
api.books.graphql.endpoint=${api.gateway.base.url}/api/graphql
api.authors.rest.endpoint=${api.gateway.base.url}/api/authors
api.orders.rest.endpoint=${api.gateway.base.url}/api/order
api.stockcheck.rest.endpoint=${api.gateway.base.url}/api/stockcheck

# Test Execution Configuration
test.parallel.enabled=true
test.parallel.threads=4
test.retry.enabled=true
test.retry.attempts=3
test.timeout.default=30
test.timeout.long=60

# Test Data Configuration
test.data.cleanup.enabled=true
test.data.unique.prefix=test_
test.data.faker.locale=en

# Database Configuration (for TestContainers)
test.db.postgres.image=postgres:15
test.db.mongo.image=mongo:7

# Reporting Configuration
allure.results.directory=target/allure-results
allure.report.directory=target/allure-report

# Improved Logging Configuration
logging.level.root=INFO
logging.level.test=INFO
logging.level.client.RestClient=DEBUG
logging.level.com.bookstore.taf=DEBUG
logging.level.io.restassured=INFO
logging.level.org.testcontainers=INFO

# Detailed logging for specific packages (debug mode)
logging.level.org.springframework.web=WARN
logging.level.org.apache.http=WARN
logging.level.httpclient=WARN

# Service Health Check Configuration
health.check.timeout=10
health.check.retry.attempts=3
health.check.retry.delay=2

# Performance Test Configuration
performance.test.duration=60
performance.test.users=10
performance.test.ramp.up=10